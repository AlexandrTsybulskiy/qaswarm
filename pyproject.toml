[project]
name = "qaswarm"
version = "0.1.0"
requires-python = ">=3.11"
description = "Cursor-native QA swarm kernel and product memory"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
